<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer hexagon border only (flat-top orientation, no fill, no antenna protrusions) -->
  <polygon
    points="96,50 73,89.8 27,89.8 4,50 27,10.2 73,10.2"
    fill="none"
    stroke="#8B44AC"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Chip body centered inside hexagon (square IC package, no connector pins) -->
  <rect x="30" y="30" width="40" height="40" rx="4" ry="4"
        fill="none" stroke="#8B44AC" stroke-width="2.5"/>

  <!-- ICS text centered inside the chip -->
  <text
    x="50" y="50"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Arial, sans-serif"
    font-size="13"
    font-weight="bold"
    letter-spacing="1"
    fill="#8B44AC"
  >ICS</text>
</svg>
